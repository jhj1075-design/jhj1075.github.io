<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>희웨딩 v9.1</title><style>
:root{--p:#b86f85;--p2:#8f4f64;--bg:#fff9fb;--card:#fff;--line:#eadde1;--muted:#806f75;--soft:#f7e9ee;--ink:#30272b}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#f2e3e9,#fff9fb 240px);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;color:var(--ink)}.wrap{max-width:1100px;margin:auto;padding:16px 12px 80px}header{display:flex;justify-content:space-between;gap:12px}h1{margin:0;font-size:40px;letter-spacing:-2px}.sub{font-size:12px;color:var(--muted)}.badge{background:white;border:1px solid var(--line);border-radius:999px;padding:8px 11px;font-weight:900;color:var(--p2)}.tabs{position:sticky;top:0;z-index:10;display:flex;gap:7px;overflow:auto;padding:10px 0;background:rgba(255,249,251,.95)}.tab{border:1px solid var(--line);background:white;border-radius:999px;padding:9px 13px;font-weight:900;white-space:nowrap}.tab.active{background:var(--p);color:white}.panel{display:none}.panel.active{display:block}.card{background:white;border:1px solid var(--line);border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 10px 25px rgba(91,49,64,.08)}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:10px}.f{grid-column:span 3}.wide{grid-column:span 6}.full{grid-column:1/-1}label{display:block;font-size:12px;font-weight:900;margin-bottom:6px}input,select,textarea{width:100%;border:1px solid #ddcfd4;border-radius:13px;padding:10px 11px}textarea{min-height:64px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{border:0;border-radius:12px;padding:9px 13px;background:var(--p);color:#fff;font-weight:900}.secondary{background:#fff;color:var(--p2);border:1px solid var(--line)}.danger{background:#fff0f1;color:#a54850;border:1px solid #efcbd0}.small{font-size:12px;padding:7px 9px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.metric{background:white;border:1px solid var(--line);border-radius:16px;padding:13px}.metric b{font-size:20px}.muted{font-size:11px;color:var(--muted)}.list{display:grid;gap:10px}.item,.cat{border:1px solid var(--line);border-radius:16px;padding:13px;background:white}.head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}.chip{background:var(--soft);border-radius:999px;padding:5px 8px;font-size:10px;font-weight:900;color:var(--p2)}.kv{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px}.kv div{background:#fcf8f9;border-radius:9px;padding:8px;font-size:12px}.checklayout{display:grid;grid-template-columns:250px 1fr;gap:12px}.sidebar{background:white;border:1px solid var(--line);border-radius:18px;padding:12px}.cat{margin-bottom:10px}.catname{font-weight:900;font-size:16px}.row{display:grid;grid-template-columns:24px 1fr auto;gap:8px;padding:10px 0;border-bottom:1px dashed #eee1e5}.row:last-child{border-bottom:0}.row input[type=checkbox]{width:18px;height:18px}.row.done .title{text-decoration:line-through;color:#999}.title{font-weight:900}.note{margin-top:6px}.icon{border:1px solid var(--line);background:white;border-radius:8px;padding:6px 8px;font-size:11px;font-weight:900;color:var(--p2)}.empty{text-align:center;color:var(--muted);padding:25px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:16px}table{border-collapse:collapse;min-width:800px;width:100%}th,td{border:1px solid #eee3e6;padding:9px;font-size:12px;text-align:center}th{background:#f8edf1}.best{background:#eef9f4}.toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%);background:#382d31;color:white;border-radius:999px;padding:10px 14px;display:none}.toast.show{display:block}@media(max-width:800px){.f{grid-column:span 6}.wide{grid-column:1/-1}.checklayout{grid-template-columns:1fr}.summary{grid-template-columns:1fr 1fr}}@media(max-width:520px){.f,.wide{grid-column:1/-1}h1{font-size:34px}.row{grid-template-columns:22px 1fr}.row .tools{grid-column:2}.summary{grid-template-columns:1fr 1fr}}

</style></head><body><div class="wrap"><header><div><h1>희웨딩 <span style="color:var(--p)">v9.1</span></h1><div class="sub">웨딩홀 비교 · 완전 커스텀 체크리스트 · 견적 · 일정 · Top 3</div></div><div class="badge">💍 Custom</div></header>
<nav class="tabs"><button class="tab active" data-tab="dash">대시보드</button><button class="tab" data-tab="halls">웨딩홀</button><button class="tab" data-tab="check">체크리스트</button><button class="tab" data-tab="ai">AI 추천</button><button class="tab" data-tab="battle">1:1 배틀</button><button class="tab" data-tab="quote">견적</button><button class="tab" data-tab="schedule">일정</button><button class="tab" data-tab="top3">Top 3</button><button class="tab" data-tab="compare">비교표</button><button class="tab" data-tab="backup">백업</button></nav>
<section id="dash" class="panel active"><div class="summary"><div class="metric"><div class="muted">등록 홀</div><b id="mHall">0</b></div><div class="metric"><div class="muted">현재 1위</div><b id="mTop">-</b></div><div class="metric"><div class="muted">체크 완료</div><b id="mCheck">0%</b></div><div class="metric"><div class="muted">최저 견적</div><b id="mQuote">-</b></div></div><div class="card"><h2>종합 순위</h2><div id="rank" class="list"></div></div></section>
<section id="halls" class="panel"><div class="card"><h2 id="formTitle">웨딩홀 입력</h2><form id="hallForm"><input type="hidden" id="editId"><div class="grid"><div class="f wide"><label>웨딩홀 이름 *</label><input id="name" required></div><div class="f"><label>지역</label><input id="location"></div><div class="f"><label>홀 타입</label><select id="hallType"><option>밝은 홀</option><option>어두운 홀</option><option>채플형</option><option>호텔</option><option>기타</option></select></div><div class="f"><label>보증 인원</label><input id="guarantee" type="number"></div><div class="f"><label>식대</label><input id="mealPrice" type="number"></div><div class="f"><label>대관·꽃장식</label><input id="venueCost" type="number"></div><div class="f"><label>예상 총비용</label><input id="totalCost" type="number"></div><div class="f"><label>교통 1~10</label><input id="transport" type="number" value="7"></div><div class="f"><label>식사 1~10</label><input id="food" type="number" value="7"></div><div class="f"><label>분위기 1~10</label><input id="atmosphere" type="number" value="7"></div><div class="f"><label>주차 1~10</label><input id="parking" type="number" value="7"></div><div class="f"><label>신부대기실 1~10</label><input id="brideRoom" type="number" value="7"></div><div class="f"><label>동선 1~10</label><input id="flow" type="number" value="7"></div><div class="f"><label>서비스 1~10</label><input id="service" type="number" value="7"></div><div class="f wide"><label>장점</label><textarea id="pros"></textarea></div><div class="f wide"><label>단점</label><textarea id="cons"></textarea></div><div class="f full"><label>끌리는 이유 ❤️</label><textarea id="emotion"></textarea></div></div><div class="actions"><button class="btn">저장</button><button type="button" class="btn secondary" id="calc">총비용 계산</button><button type="button" class="btn secondary" id="reset">초기화</button></div></form></div><div class="card"><h2>웨딩홀 목록</h2><div id="hallList" class="list"></div></div></section>
<section id="check" class="panel"><div class="card"><h2>✅ 완전 커스텀 체크리스트</h2><div class="muted">빈 상태에서 직접 카테고리와 항목을 만들고, 항목별 메모와 순서를 관리할 수 있어요.</div></div><div class="checklayout"><div class="sidebar"><label>웨딩홀</label><select id="checkHall"></select><div class="actions"><button class="btn small" id="addCat">+ 카테고리</button></div><hr style="border:0;border-top:1px solid var(--line);margin:14px 0"><label>템플릿</label><select id="template"></select><div class="actions"><button class="btn secondary small" id="saveTpl">현재 구성 저장</button><button class="btn secondary small" id="applyTpl">모든 홀 적용</button><button class="btn danger small" id="delTpl">삭제</button></div></div><div id="checkList"></div></div></section>
<section id="ai" class="panel"><div class="card"><h2>🤖 스마트 추천</h2><div class="grid"><div class="f"><label>선호 홀</label><select id="pref"><option value="bright">밝은 홀</option><option value="dark">어두운 홀</option><option value="any">상관없음</option></select></div><div class="f"><label>하객 수</label><input id="guests" type="number" value="200"></div><div class="f"><label>최대 예산</label><input id="budget" type="number" value="27000000"></div><div class="f"><label>최우선</label><select id="priority"><option value="food">식사</option><option value="transport">교통</option><option value="atmosphere">분위기</option><option value="cost">가격</option></select></div></div><div class="actions"><button class="btn" id="analyze">분석</button></div></div><div id="aiList" class="list"></div></section>
<section id="battle" class="panel"><div class="card"><h2>🥊 1:1 배틀</h2><div class="grid"><div class="f wide"><label>웨딩홀 A</label><select id="battleA"></select></div><div class="f wide"><label>웨딩홀 B</label><select id="battleB"></select></div></div></div><div id="battleResult"></div></section>
<section id="quote" class="panel"><div class="card"><h2>💰 견적</h2><div class="grid"><div class="f wide"><label>웨딩홀</label><select id="quoteHall"></select></div><div class="f"><label>대관료</label><input id="qVenue" type="number"></div><div class="f"><label>꽃장식</label><input id="qFlower" type="number"></div><div class="f"><label>식대</label><input id="qMeal" type="number"></div><div class="f"><label>보증 인원</label><input id="qGuest" type="number"></div><div class="f"><label>기타</label><input id="qEtc" type="number"></div><div class="f full"><label>메모</label><textarea id="qMemo"></textarea></div></div><div class="actions"><button class="btn" id="saveQuote">견적 저장</button></div></div><div id="quoteList" class="list"></div></section>
<section id="schedule" class="panel"><div class="card"><h2>📅 일정</h2><div class="grid"><div class="f wide"><label>웨딩홀</label><select id="scheduleHall"></select></div><div class="f"><label>날짜</label><input id="scheduleDate" type="date"></div><div class="f"><label>시간</label><input id="scheduleTime" type="time"></div><div class="f full"><label>메모</label><textarea id="scheduleMemo"></textarea></div></div><div class="actions"><button class="btn" id="addSchedule">일정 추가</button></div></div><div id="scheduleList" class="list"></div></section>
<section id="top3" class="panel"><div class="card"><h2>🏆 Top 3</h2><div class="muted">웨딩홀 목록에서 ❤️ 버튼을 눌러 최대 3곳을 고르세요.</div></div><div id="topList" class="list"></div></section>
<section id="compare" class="panel"><div class="card"><div class="head"><h2>비교표</h2><button class="btn secondary small" id="print">PDF 저장 / 인쇄</button></div><div id="compareTable"></div></div></section>
<section id="backup" class="panel"><div class="card"><h2>백업·복원</h2><div class="actions"><button class="btn" id="export">백업 저장</button><button class="btn secondary" id="import">백업 불러오기</button><input hidden id="file" type="file" accept=".json"><button class="btn danger" id="clear">전체 삭제</button></div></div></section>
</div><div id="toast" class="toast"></div><script>
const K='heeWeddingV9';const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],n=v=>Number(v)||0,e=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])),uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6),won=v=>n(v)?new Intl.NumberFormat('ko-KR').format(n(v))+'원':'-';
function seed(name,location,hallType){return{id:uid('h'),name,location,hallType,guarantee:'',mealPrice:'',venueCost:'',totalCost:'',transport:7,food:7,atmosphere:7,parking:7,brideRoom:7,flow:7,service:7,pros:'',cons:'',emotion:''}}
let S=JSON.parse(localStorage.getItem(K)||'null')||{halls:[seed('셀럽앤어셈','강남권','밝은 홀'),seed('엘블레스','양재권','밝은 홀'),seed('노블발렌티 삼성','삼성역권','어두운 홀')],checks:{},templates:[],quotes:{},schedules:[],top3:[],profile:{pref:'bright',guests:200,budget:27000000,priority:'food'}};const save=()=>localStorage.setItem(K,JSON.stringify(S));function toast(x){$('#toast').textContent=x;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),1400)}function tab(id){$$('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===id));$$('.panel').forEach(x=>x.classList.toggle('active',x.id===id))}$$('.tab').forEach(b=>b.onclick=()=>tab(b.dataset.tab));
const total=h=>n(h.totalCost)||n(h.venueCost)+n(h.guarantee)*n(h.mealPrice);function score(h){let a=[h.transport,h.food,h.atmosphere,h.parking,h.brideRoom,h.flow,h.service].map(n).reduce((x,y)=>x+y,0)/7;let costs=S.halls.map(total).filter(Boolean),c=total(h),cs=costs.length&&c?10-(c-Math.min(...costs))/(Math.max(...costs)-Math.min(...costs)||1)*4:7;return(a*.75+cs*.25)*10}const ranked=()=>[...S.halls].map(h=>({...h,_score:score(h),_total:total(h)})).sort((a,b)=>b._score-a._score);const qTotal=q=>n(q.venue)+n(q.flower)+n(q.meal)*n(q.guest)+n(q.etc);const checks=id=>S.checks[id]||(S.checks[id]=[]);
function fill(){['checkHall','quoteHall','scheduleHall','battleA','battleB'].forEach((id,i)=>{let x=$('#'+id),v=x.value;x.innerHTML=S.halls.map(h=>`<option value="${h.id}">${e(h.name)}</option>`).join('');if(S.halls.some(h=>h.id===v))x.value=v;else if(S.halls[i])x.value=S.halls[i].id})}
function dashboard(){let r=ranked(),all=Object.values(S.checks).flatMap(x=>x.flatMap(g=>g.items)),qs=Object.values(S.quotes).map(qTotal).filter(Boolean);$('#mHall').textContent=S.halls.length;$('#mTop').textContent=r[0]?.name||'-';$('#mCheck').textContent=all.length?Math.round(all.filter(x=>x.done).length/all.length*100)+'%':'0%';$('#mQuote').textContent=qs.length?won(Math.min(...qs)):'-';$('#rank').innerHTML=r.map((h,i)=>`<div class="item"><div class="head"><div><b>${i+1}. ${e(h.name)}</b><div class="chips"><span class="chip">${e(h.location||'-')}</span><span class="chip">${e(h.hallType)}</span></div></div><b>${h._score.toFixed(1)}</b></div></div>`).join('')||'<div class="empty">웨딩홀을 추가하세요.</div>'}
function halls(){ $('#hallList').innerHTML=ranked().map(h=>`<div class="item"><div class="head"><div><b>${e(h.name)}</b><div class="chips"><span class="chip">${e(h.location||'-')}</span><span class="chip">${h._score.toFixed(1)}점</span></div></div></div><div class="kv"><div>총비용<br><b>${won(h._total)}</b></div><div>체크항목<br><b>${checks(h.id).flatMap(g=>g.items).length}개</b></div></div><div class="actions"><button class="btn secondary small" onclick="editHall('${h.id}')">수정</button><button class="btn secondary small" onclick="topToggle('${h.id}')">${S.top3.includes(h.id)?'💔 해제':'❤️ Top 3'}</button><button class="btn danger small" onclick="delHall('${h.id}')">삭제</button></div></div>`).join('')||'<div class="empty">웨딩홀을 추가하세요.</div>' }
$('#calc').onclick=()=>$('#totalCost').value=n($('#venueCost').value)+n($('#guarantee').value)*n($('#mealPrice').value)||'';function reset(){ $('#hallForm').reset();$('#editId').value='';$('#formTitle').textContent='웨딩홀 입력';['transport','food','atmosphere','parking','brideRoom','flow','service'].forEach(id=>$('#'+id).value=7)}$('#reset').onclick=reset;$('#hallForm').onsubmit=ev=>{ev.preventDefault();let id=$('#editId').value,h={id:id||uid('h'),name:$('#name').value.trim(),location:$('#location').value.trim(),hallType:$('#hallType').value,guarantee:$('#guarantee').value,mealPrice:$('#mealPrice').value,venueCost:$('#venueCost').value,totalCost:$('#totalCost').value,transport:$('#transport').value,food:$('#food').value,atmosphere:$('#atmosphere').value,parking:$('#parking').value,brideRoom:$('#brideRoom').value,flow:$('#flow').value,service:$('#service').value,pros:$('#pros').value,cons:$('#cons').value,emotion:$('#emotion').value};if(!h.totalCost)h.totalCost=total(h)||'';S.halls=id?S.halls.map(x=>x.id===id?h:x):[...S.halls,h];save();reset();render();toast('저장했어요.')};window.editHall=id=>{let h=S.halls.find(x=>x.id===id);Object.entries(h).forEach(([k,v])=>{let x=$('#'+k);if(x)x.value=v??''});$('#editId').value=id;$('#formTitle').textContent='웨딩홀 수정';tab('halls')};window.delHall=id=>{if(!confirm('삭제할까요?'))return;S.halls=S.halls.filter(x=>x.id!==id);delete S.checks[id];delete S.quotes[id];S.top3=S.top3.filter(x=>x!==id);save();render()};
function template(){ $('#template').innerHTML=S.templates.map(t=>`<option value="${t.id}">${e(t.name)}</option>`).join('')||'<option value="">저장된 템플릿 없음</option>' }
let editCatId=null,editItemId=null;
function checklist(){fill();template();let id=$('#checkHall').value;if(!id)return $('#checkList').innerHTML='<div class="empty">웨딩홀을 추가하세요.</div>';let gs=checks(id);$('#checkList').innerHTML=gs.map(g=>`<div class="cat"><div class="head">${editCatId===g.id?`<div class="editbox" style="flex:1"><input id="catEdit-${g.id}" value="${e(g.name)}"><div class="editactions"><button class="btn small" onclick="saveCatEdit('${id}','${g.id}')">💾 저장</button><button class="btn secondary small" onclick="cancelCatEdit()">취소</button></div></div>`:`<div class="catview"><span>📂</span><div class="catname">${e(g.name)}</div></div>`}<div class="rowtools">${editCatId===g.id?'':`<button class="icon" onclick="startCatEdit('${g.id}')">✏️ 수정</button>`}<button class="icon" onclick="catMove('${id}','${g.id}',-1)">↑</button><button class="icon" onclick="catMove('${id}','${g.id}',1)">↓</button><button class="icon" onclick="itemAdd('${id}','${g.id}')">+ 항목</button><button class="icon" onclick="copyAll('${id}','${g.id}')">모든 홀 복사</button><button class="icon" onclick="catDel('${id}','${g.id}')">🗑 삭제</button></div></div>${g.items.map(it=>`<div class="row ${it.done?'done':''}"><input type="checkbox" ${it.done?'checked':''} onchange="itemDone('${id}','${g.id}','${it.id}',this.checked)"><div>${editItemId===it.id?`<div class="editbox"><label>항목명</label><input id="itemText-${it.id}" value="${e(it.text)}"><label>메모</label><textarea id="itemNote-${it.id}" placeholder="항목별 메모">${e(it.note||'')}</textarea><div class="editactions"><button class="btn small" onclick="saveItemEdit('${id}','${g.id}','${it.id}')">💾 저장</button><button class="btn secondary small" onclick="cancelItemEdit()">취소</button></div></div>`:`<div class="readline">${e(it.text)}</div><div class="readnote ${it.note?'':'empty-note'}">${it.note?'📝 '+e(it.note):'+ 메모 추가'}</div>`}</div><div class="rowtools">${editItemId===it.id?'':`<button class="icon" onclick="startItemEdit('${it.id}')">✏️ 수정</button>`}<button class="icon" onclick="itemMove('${id}','${g.id}','${it.id}',-1)">↑</button><button class="icon" onclick="itemMove('${id}','${g.id}','${it.id}',1)">↓</button><button class="icon" onclick="itemDel('${id}','${g.id}','${it.id}')">🗑 삭제</button></div></div>`).join('')||'<div class="empty">항목 추가를 눌러 시작하세요.</div>'}</div>`).join('')||'<div class="empty">카테고리 추가를 눌러 직접 만들어 보세요.</div>'}
$('#checkHall').onchange=()=>{editCatId=null;editItemId=null;checklist()};window.startCatEdit=id=>{editCatId=id;editItemId=null;checklist()};window.cancelCatEdit=()=>{editCatId=null;checklist()};window.saveCatEdit=(h,g)=>{let v=$('#catEdit-'+g).value.trim();if(!v)return alert('카테고리 이름을 입력하세요.');checks(h).find(x=>x.id===g).name=v;editCatId=null;save();checklist();toast('카테고리를 수정했어요.')};window.startItemEdit=id=>{editItemId=id;editCatId=null;checklist()};window.cancelItemEdit=()=>{editItemId=null;checklist()};window.saveItemEdit=(h,g,i)=>{let t=$('#itemText-'+i).value.trim(),note=$('#itemNote-'+i).value;if(!t)return alert('항목명을 입력하세요.');let it=checks(h).find(x=>x.id===g).items.find(x=>x.id===i);it.text=t;it.note=note;editItemId=null;save();checklist();toast('항목을 수정했어요.')};$('#addCat').onclick=()=>{let id=$('#checkHall').value,name=prompt('카테고리 이름');if(id&&name){checks(id).push({id:uid('g'),name,items:[]});save();checklist()}};window.catName=(h,g,v)=>{checks(h).find(x=>x.id===g).name=v;save()};window.catMove=(h,g,d)=>{let a=checks(h),i=a.findIndex(x=>x.id===g),j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];save();checklist()};window.catDel=(h,g)=>{if(!confirm('카테고리를 삭제할까요?'))return;S.checks[h]=checks(h).filter(x=>x.id!==g);save();checklist()};window.itemAdd=(h,g)=>{let t=prompt('체크 항목');if(t){checks(h).find(x=>x.id===g).items.push({id:uid('i'),text:t,note:'',done:false});save();checklist()}};window.itemName=(h,g,i,v)=>{checks(h).find(x=>x.id===g).items.find(x=>x.id===i).text=v;save()};window.itemNote=(h,g,i,v)=>{checks(h).find(x=>x.id===g).items.find(x=>x.id===i).note=v;save()};window.itemDone=(h,g,i,v)=>{checks(h).find(x=>x.id===g).items.find(x=>x.id===i).done=v;save();dashboard()};window.itemMove=(h,g,i,d)=>{let a=checks(h).find(x=>x.id===g).items,x=a.findIndex(y=>y.id===i),j=x+d;if(j<0||j>=a.length)return;[a[x],a[j]]=[a[j],a[x]];save();checklist()};window.itemDel=(h,g,i)=>{if(!confirm('이 항목을 삭제할까요?'))return;let x=checks(h).find(x=>x.id===g);x.items=x.items.filter(x=>x.id!==i);save();checklist()};window.copyAll=(h,g)=>{let c=checks(h).find(x=>x.id===g);S.halls.forEach(x=>{if(x.id!==h)checks(x.id).push({id:uid('g'),name:c.name,items:c.items.map(i=>({id:uid('i'),text:i.text,note:'',done:false}))})});save();toast('모든 홀에 복사했어요.')};
$('#saveTpl').onclick=()=>{let id=$('#checkHall').value,name=prompt('템플릿 이름');if(id&&name){S.templates.push({id:uid('t'),name,groups:JSON.parse(JSON.stringify(checks(id)))});save();template()}};$('#applyTpl').onclick=()=>{let t=S.templates.find(x=>x.id===$('#template').value);if(!t)return;S.halls.forEach(h=>S.checks[h.id]=t.groups.map(g=>({id:uid('g'),name:g.name,items:g.items.map(i=>({id:uid('i'),text:i.text,note:'',done:false}))})));save();checklist();toast('모든 홀에 적용했어요.')};$('#delTpl').onclick=()=>{let id=$('#template').value;S.templates=S.templates.filter(x=>x.id!==id);save();template()};
function ai(){let p=S.profile;$('#pref').value=p.pref;$('#guests').value=p.guests;$('#budget').value=p.budget;$('#priority').value=p.priority;$('#aiList').innerHTML=ranked().map((h,i)=>{let why=[],warn=[],s=h._score;if(p.pref==='bright'&&h.hallType.includes('밝')){why.push('밝은 홀 선호와 잘 맞음');s+=4}if(p.pref==='dark'&&h.hallType.includes('어두')){why.push('어두운 홀 선호와 잘 맞음');s+=4}if(n(h.food)>=8)why.push('식사 점수 높음');if(total(h)>n(p.budget))warn.push('예산 초과');return`<div class="item"><b>${i+1}위 ${e(h.name)}</b><p>추천: ${e(why.join(', ')||'정보를 더 입력하면 정확해져요.')}</p><p>확인: ${e(warn.join(', ')||'큰 주의점 없음')}</p></div>`}).join('')};$('#analyze').onclick=()=>{S.profile={pref:$('#pref').value,guests:n($('#guests').value),budget:n($('#budget').value),priority:$('#priority').value};save();ai()};
function battle(){fill();let a=S.halls.find(x=>x.id===$('#battleA').value),b=S.halls.find(x=>x.id===$('#battleB').value);if(!a||!b)return;let rows=[['가격',total(a)<total(b)?a.name:b.name],['식사',n(a.food)>=n(b.food)?a.name:b.name],['교통',n(a.transport)>=n(b.transport)?a.name:b.name],['분위기',n(a.atmosphere)>=n(b.atmosphere)?a.name:b.name],['주차',n(a.parking)>=n(b.parking)?a.name:b.name]],aw=rows.filter(x=>x[1]===a.name).length,bw=rows.filter(x=>x[1]===b.name).length;$('#battleResult').innerHTML=`<div class="card"><h2>${e(a.name)} ${aw} : ${bw} ${e(b.name)}</h2><div class="kv">${rows.map(x=>`<div>${x[0]}<br><b>${e(x[1])}</b></div>`).join('')}</div><h3>🏆 ${aw>bw?e(a.name):bw>aw?e(b.name):'무승부'}</h3></div>`}$('#battleA').onchange=battle;$('#battleB').onchange=battle;
function quotes(){fill();let id=$('#quoteHall').value,q=S.quotes[id]||{};$('#qVenue').value=q.venue||'';$('#qFlower').value=q.flower||'';$('#qMeal').value=q.meal||'';$('#qGuest').value=q.guest||'';$('#qEtc').value=q.etc||'';$('#qMemo').value=q.memo||'';let ps=S.halls.map(h=>({h,t:qTotal(S.quotes[h.id]||{})})).filter(x=>x.t),min=ps.length?Math.min(...ps.map(x=>x.t)):0;$('#quoteList').innerHTML=S.halls.map(h=>{let t=qTotal(S.quotes[h.id]||{});return`<div class="item ${t&&t===min?'best':''}"><b>${e(h.name)}</b><div style="font-size:20px;font-weight:900;margin-top:6px">${t?won(t):'미입력'}</div>${t&&min?`<div class="muted">최저가 대비 ${won(t-min)}</div>`:''}</div>`}).join('')};$('#quoteHall').onchange=quotes;$('#saveQuote').onclick=()=>{let id=$('#quoteHall').value;S.quotes[id]={venue:$('#qVenue').value,flower:$('#qFlower').value,meal:$('#qMeal').value,guest:$('#qGuest').value,etc:$('#qEtc').value,memo:$('#qMemo').value};save();quotes();dashboard()};
function schedules(){fill();S.schedules.sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));$('#scheduleList').innerHTML=S.schedules.map(s=>`<div class="item" style="${s.done?'opacity:.55':''}"><div class="head"><div><b>${s.date} ${s.time||''}</b><div>${e(S.halls.find(h=>h.id===s.hallId)?.name||'-')}</div><div class="muted">${e(s.memo||'')}</div></div><div><button class="btn secondary small" onclick="schDone('${s.id}')">${s.done?'되돌리기':'완료'}</button><button class="btn danger small" onclick="schDel('${s.id}')">삭제</button></div></div></div>`).join('')||'<div class="empty">일정을 추가하세요.</div>'};$('#addSchedule').onclick=()=>{let hallId=$('#scheduleHall').value,date=$('#scheduleDate').value;if(!hallId||!date)return alert('홀과 날짜를 입력하세요.');S.schedules.push({id:uid('s'),hallId,date,time:$('#scheduleTime').value,memo:$('#scheduleMemo').value,done:false});save();schedules()};window.schDone=id=>{let s=S.schedules.find(x=>x.id===id);s.done=!s.done;save();schedules()};window.schDel=id=>{S.schedules=S.schedules.filter(x=>x.id!==id);save();schedules()};
window.topToggle=id=>{if(S.top3.includes(id))S.top3=S.top3.filter(x=>x!==id);else{if(S.top3.length>=3)return alert('최대 3곳이에요.');S.top3.push(id)}save();halls();tops()};function tops(){$('#topList').innerHTML=S.top3.map((id,i)=>ranked().find(x=>x.id===id)).filter(Boolean).map((h,i)=>`<div class="item"><h2>${i+1}. ${e(h.name)}</h2><div class="kv"><div>점수<br><b>${h._score.toFixed(1)}</b></div><div>비용<br><b>${won(h._total)}</b></div></div><p>${e(h.emotion||'끌리는 이유 미입력')}</p></div>`).join('')||'<div class="empty">Top 3를 선택하세요.</div>'}
function compare(){let r=ranked(),rows=[['점수',h=>h._score.toFixed(1)],['총비용',h=>won(h._total)],['식대',h=>won(h.mealPrice)],['교통',h=>h.transport+'/10'],['식사',h=>h.food+'/10'],['분위기',h=>h.atmosphere+'/10'],['주차',h=>h.parking+'/10'],['장점',h=>e(h.pros||'-')],['단점',h=>e(h.cons||'-')]];$('#compareTable').innerHTML='<div class="tablewrap"><table><tr><th>항목</th>'+r.map(h=>`<th>${e(h.name)}</th>`).join('')+'</tr>'+rows.map(x=>'<tr><th>'+x[0]+'</th>'+r.map(h=>'<td>'+x[1](h)+'</td>').join('')+'</tr>').join('')+'</table></div>'}$('#print').onclick=()=>window.print();
function render(){fill();dashboard();halls();checklist();ai();battle();quotes();schedules();tops();compare()}$('#export').onclick=()=>{let a=document.createElement('a'),b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});a.href=URL.createObjectURL(b);a.download='hee-wedding-v9.1-backup.json';a.click()};$('#import').onclick=()=>$('#file').click();$('#file').onchange=async ev=>{try{S=JSON.parse(await ev.target.files[0].text());save();render();toast('복원했어요.')}catch{alert('올바른 파일이 아니에요.')}};$('#clear').onclick=()=>{if(confirm('전체 삭제할까요?')){localStorage.removeItem(K);location.reload()}};save();render();
</script></body></html>
